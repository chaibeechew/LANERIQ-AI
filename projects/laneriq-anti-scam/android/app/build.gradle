plugins { id 'com.android.application' }

android {
    namespace 'ai.laneriq.antiscam'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.laneriq.antiscam'
        minSdk 26
        targetSdk 36
        versionCode 4000
        versionName '0.4.0-rc.1'
        resValue 'string', 'app_name', 'LANERIQ Anti Scam'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'LANERIQ Anti Scam Test'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
