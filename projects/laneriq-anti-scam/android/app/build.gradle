plugins { id 'com.android.application' }

android {
    namespace 'ai.laneriq.antiscam'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.laneriq.antiscam.test'
        minSdk 26
        targetSdk 35
        versionCode 3001
        versionName '0.3.0-protection.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
