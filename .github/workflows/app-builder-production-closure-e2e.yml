name: LANERIQ App Builder Production Closure Gate

on:
  pull_request:
    paths:
      - "app/production-closure-e2e/route.js"
      - "public/production-closure-e2e-v3.js"
      - "app/api/orchestrate/route.js"
      - "app/api/generate/route.js"
      - "app/api/modify/route.js"
      - "app/api/production-e2e/zero-spend/route.js"
      - "app/api/production-e2e/evidence-ledger/route.js"
      - "app/api/production-e2e/evidence-status/route.js"
      - "app/api/templates/route.js"
      - "app/api/apps/[id]/route.js"
      - "app/api/apps/[id]/quality/route.js"
      - "app/api/apps/[id]/rollback/route.js"
      - "app/api/apps/[id]/database/route.js"
      - "app/api/apps/[id]/database/rollback/route.js"
      - "app/api/apps/[id]/workflows/route.js"
      - "app/api/apps/[id]/workflows/[workflowId]/run/route.js"
      - "app/api/apps/[id]/publish/route.js"
      - "lib/production-e2e/**"
      - "lib/cloud-adapters/production-e2e-evidence-data.js"
      - "supabase/migrations/*production_e2e_evidence_ledger*.sql"
      - "app/page.js"
      - "app/create/page.js"
      - "app/preview/[id]/page.js"
      - "app/release/[id]/page.js"
      - "app/app-dashboard/[id]/page.js"
      - "app/my-apps/page.js"
      - "app/templates/page.js"
      - "app/templates/[id]/page.js"
      - "app/soolen-ai/page.js"
      - "app/workflows/[id]/page.js"
      - "app/analytics/[id]/page.js"
      - "app/studio/page.js"
      - "app/editor/[id]/page.js"
      - "app/database/[id]/page.js"
      - "app/operations/[id]/page.js"
      - "app/publish/[id]/page.js"
      - "lib/product/laneriq-18-page-master.js"
      - "scripts/app-builder-production-closure-e2e-contract-tests.mjs"
      - ".github/workflows/app-builder-production-closure-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/production-closure-e2e/route.js"
      - "public/production-closure-e2e-v3.js"
      - "app/api/orchestrate/route.js"
      - "app/api/generate/route.js"
      - "app/api/modify/route.js"
      - "app/api/production-e2e/zero-spend/route.js"
      - "app/api/production-e2e/evidence-ledger/route.js"
      - "app/api/production-e2e/evidence-status/route.js"
      - "app/api/templates/route.js"
      - "app/api/apps/[id]/route.js"
      - "app/api/apps/[id]/quality/route.js"
      - "app/api/apps/[id]/rollback/route.js"
      - "app/api/apps/[id]/database/route.js"
      - "app/api/apps/[id]/database/rollback/route.js"
      - "app/api/apps/[id]/workflows/route.js"
      - "app/api/apps/[id]/workflows/[workflowId]/run/route.js"
      - "app/api/apps/[id]/publish/route.js"
      - "lib/production-e2e/**"
      - "lib/cloud-adapters/production-e2e-evidence-data.js"
      - "supabase/migrations/*production_e2e_evidence_ledger*.sql"
      - "app/page.js"
      - "app/create/page.js"
      - "app/preview/[id]/page.js"
      - "app/release/[id]/page.js"
      - "app/app-dashboard/[id]/page.js"
      - "app/my-apps/page.js"
      - "app/templates/page.js"
      - "app/templates/[id]/page.js"
      - "app/soolen-ai/page.js"
      - "app/workflows/[id]/page.js"
      - "app/analytics/[id]/page.js"
      - "app/studio/page.js"
      - "app/editor/[id]/page.js"
      - "app/database/[id]/page.js"
      - "app/operations/[id]/page.js"
      - "app/publish/[id]/page.js"
      - "lib/product/laneriq-18-page-master.js"
      - "scripts/app-builder-production-closure-e2e-contract-tests.mjs"
      - ".github/workflows/app-builder-production-closure-e2e.yml"

permissions:
  contents: read

jobs:
  app-builder-production-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      LANERIQ_EVIDENCE_LEVEL: CODE_CI_ONLY
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate authenticated full closure contract
        run: node scripts/app-builder-production-closure-e2e-contract-tests.mjs

      - name: Build runtime integration
        run: npm run build

      - name: Evidence boundary
        run: |
          echo "✓ This gate proves CODE + CI + build integration for the 18-stage authenticated closure and durable server evidence ledger."
          echo "✓ Critical persisted App/Version/Database/Workflow/Publish/Private states are reverified server-side before a PASS receipt can be issued."
          echo "✓ Browser-only 18-page and anonymous HTTP health remains labeled browser evidence; the ledger stores privacy-bounded summaries and a SHA-256 report digest only."
          echo "✓ Authenticated Production execution still requires a real signed-in user session on exact main."
          echo "✓ Physical-device, provider-LIVE, physical DB migration, Email/WhatsApp/SMS and official-store evidence remain independent."
