name: 0.2 - LANERIQ Production Release Closure Index

on:
  pull_request:
    branches: [main]
    paths:
      - "config/production-release-closure-policy.json"
      - "scripts/production-release-closure-index.mjs"
      - "scripts/production-release-closure-index-contract-tests.mjs"
      - ".github/workflows/production-release-closure-index.yml"
      - "scripts/core-release-gate-manifest.mjs"
      - "scripts/core-release-gate-contract-tests.mjs"
      - ".github/workflows/core-release-gate.yml"
  push:
    branches: [main]

concurrency:
  group: laneriq-production-release-closure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      LANERIQ_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LANERIQ_CANDIDATE_SHA }}
          fetch-depth: 2
      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LANERIQ_CANDIDATE_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Production Release Closure Index contract
        run: node scripts/production-release-closure-index-contract-tests.mjs

  live-closure-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LANERIQ_CLOSURE_SHA: ${{ github.sha }}
      LANERIQ_BASE_SHA: ${{ github.event.before }}
      LANERIQ_PRODUCTION_URL: https://laneriq-ai.vercel.app
      LANERIQ_CLOSURE_MAX_ATTEMPTS: "180"
      LANERIQ_CLOSURE_RETRY_MS: "10000"
    steps:
      - name: Checkout exact main SHA with full push history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact main and base identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LANERIQ_CLOSURE_SHA"
          git cat-file -e "$LANERIQ_BASE_SHA^{commit}"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build exact-SHA Production Release Closure Index
        run: node scripts/production-release-closure-index.mjs
      - name: Upload Production Release Closure Index evidence package
        id: closure_artifact
        uses: actions/upload-artifact@v4
        with:
          name: laneriq-production-release-closure-${{ github.sha }}-${{ github.run_id }}
          path: |
            production-release-closure-index.json
            production-release-closure-index.json.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
      - name: Record closure artifact receipt
        shell: bash
        run: |
          {
            echo "- Closure artifact ID: \`${{ steps.closure_artifact.outputs.artifact-id }}\`"
            echo "- Closure artifact digest: \`${{ steps.closure_artifact.outputs.artifact-digest }}\`"
            echo "- Retention: **30 days internal CI evidence**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Truth boundary
        run: |
          echo "✓ Runtime closure does not equal Global Production completion."
          echo "✓ This gate observes the complete main push range, exact-SHA GitHub Actions, retained CI evidence receipts, and public Production runtime/deployment identity."
          echo "✓ It does not mutate deployments, Supabase, DNS, providers, devices, stores, Email, WhatsApp or SMS."
          echo "✓ Supabase LIVE schema/security, provider-LIVE output, physical-device behavior and other external evidence remain separately governed."
