name: LANERIQ Workload Protection, Capacity & Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/infrastructure/**"
      - "scripts/workload-protection-exit-drill-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workload-protection-exit-drill.yml"

jobs:
  workload-protection-capacity-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run workload protection, capacity, recovery and exit-drill contracts
        run: node scripts/workload-protection-exit-drill-contract-tests.mjs
      - name: Report
        run: echo "LANERIQ workload protection, fair-share capacity, advisory server trigger, zero-cost queue persistence, recovery runbook, and provider-exit dry-run contracts passed. This gate does not enable paid queues, live chaos, live provider cutover, automatic hardware provisioning, dedicated servers, Email, or SMS."
