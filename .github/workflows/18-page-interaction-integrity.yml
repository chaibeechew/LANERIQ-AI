name: LANERIQ 18-Page Interaction Integrity

# Compatibility workflow name retained for Production Release Control history.
# The customer UI authority is now the canonical registry; this workflow must never require restoration of fixed-page UI.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/product/canonical-ui-registry.js'
      - 'scripts/canonical-ui-source-of-truth-tests.mjs'
      - '.github/workflows/18-page-interaction-integrity.yml'
  push:
    branches:
      - main
      - 'ui/canonical-*'
    paths:
      - 'app/**'
      - 'lib/product/canonical-ui-registry.js'
      - 'scripts/canonical-ui-source-of-truth-tests.mjs'
      - '.github/workflows/18-page-interaction-integrity.yml'

jobs:
  interaction-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical interaction surfaces
        run: node scripts/canonical-ui-source-of-truth-tests.mjs
      - name: Evidence boundary
        run: echo 'CODE/CI canonical UI evidence only. Browser, provider, device and store evidence remain separate.'
