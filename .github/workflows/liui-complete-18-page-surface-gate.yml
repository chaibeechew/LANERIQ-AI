name: LANERIQ Complete 18-Page LIUI Surface Gate

# Compatibility workflow identity retained for historical release-policy references.
# Runtime UI authority is the canonical registry and canonical product surface.
on:
  pull_request:
    paths:
      - "app/**"
      - "lib/product/canonical-ui-registry.js"
      - "scripts/canonical-ui-source-of-truth-tests.mjs"
      - ".github/workflows/liui-complete-18-page-surface-gate.yml"
  push:
    branches: [main, 'ui/canonical-*']
    paths:
      - "app/**"
      - "lib/product/canonical-ui-registry.js"
      - "scripts/canonical-ui-source-of-truth-tests.mjs"
      - ".github/workflows/liui-complete-18-page-surface-gate.yml"

permissions:
  contents: read

jobs:
  complete-liui-surface-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      LANERIQ_EVIDENCE_LEVEL: CODE_CI_ONLY
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical LIUI surface contract
        run: node scripts/canonical-ui-source-of-truth-tests.mjs
      - name: Build runtime integration
        run: npm run build
      - name: Evidence boundary
        run: |
          echo "✓ Canonical LIUI gate proves CODE + CI + build integration only."
          echo "✓ It does not prove LIVE_PROVIDER, PHYSICAL_DEVICE or OFFICIAL_STORE status."
          echo "✓ Production exact SHA + mobile browser/runtime evidence remains a post-merge requirement."
