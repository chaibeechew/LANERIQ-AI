name: LANERIQ Outcome Intelligence & Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/ai/**"
      - "lib/buildStandards.js"
      - "app/api/generate/**"
      - "app/api/modify/**"
      - "scripts/generation-outcome-intelligence-contract-tests.mjs"
      - "scripts/benchmark-factory-contract-tests.mjs"
      - "scripts/outcome-intelligence-release-gate-tests.mjs"
      - "scripts/batch36b-executable-quality-loop-tests.mjs"
      - "scripts/batch37-replan-reduction-tests.mjs"
      - "scripts/batch38-outcome-learning-tests.mjs"
      - "scripts/release-quality-generation-sample.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/outcome-intelligence-release-gate.yml"

jobs:
  outcome-intelligence-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SOOLEN_COST_MODE: zero
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generation Outcome Intelligence baseline
        run: npm run test:generation-outcome
      - name: Benchmark Factory baseline
        run: npm run test:benchmark-factory
      - name: Outcome Intelligence and Release Quality contracts
        run: node scripts/outcome-intelligence-release-gate-tests.mjs
      - name: Batch 36b executable quality loop contract
        run: node scripts/batch36b-executable-quality-loop-tests.mjs
      - name: Batch 37 replan reduction contract
        run: node scripts/batch37-replan-reduction-tests.mjs
      - name: Batch 38 privacy-safe outcome learning contract
        run: node scripts/batch38-outcome-learning-tests.mjs
      - name: Execute 50-industry zero-cost full-pipeline generation sample and learning comparison
        run: node scripts/release-quality-generation-sample.mjs
      - name: Build runtime integration
        run: npm run build
      - name: Upload executable quality and learning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-generation-sample-${{ github.run_id }}
          path: |
            artifacts/quality/release-quality-generation-sample.json
            artifacts/quality/outcome-learning-record.json
          if-no-files-found: warn
          retention-days: 14
      - name: Evidence boundary
        run: echo "This gate proves deterministic CODE/CI zero-cost full-pipeline quality-control and privacy-safe release learning only; external-provider LIVE, Production runtime, browser, physical-device, store, user-behavior and market evidence remain independent."
