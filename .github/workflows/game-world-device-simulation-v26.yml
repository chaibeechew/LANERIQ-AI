name: Game World Device Simulation V26 Gate
on:
  push:
    branches: [batch187-game-world-device-simulation-v26]
  pull_request:
    paths:
      - 'lib/game/game-world-device-simulation-v26.js'
      - 'scripts/game-world-device-simulation-v26-tests.mjs'
      - '.github/workflows/game-world-device-simulation-v26.yml'
jobs:
  device-simulation-v26:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: V25 closure regression
        run: node scripts/game-world-production-evidence-v25-tests.mjs
      - name: Synthetic device matrix truth gate
        run: node scripts/game-world-device-simulation-v26-tests.mjs
      - name: Next production build
        run: npm run build
