name: LANERIQ Canonical Home LIUI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/page.js"
      - "app/layout.js"
      - "app/home-*.css"
      - "app/liui-*.css"
      - "app/components/AdaptiveWallpaperEngine.js"
      - "app/components/LIUIRealProductSurface.js"
      - "scripts/batch65-page1-liui-completion-tests.mjs"
      - "scripts/ui-regression-gate.mjs"
      - ".github/workflows/page1-liui-completion-gate.yml"
  push:
    branches: [main]
    paths:
      - "app/page.js"
      - "app/layout.js"
      - "app/home-*.css"
      - "app/liui-*.css"
      - "app/components/AdaptiveWallpaperEngine.js"
      - "app/components/LIUIRealProductSurface.js"
      - "scripts/batch65-page1-liui-completion-tests.mjs"
      - "scripts/ui-regression-gate.mjs"
      - ".github/workflows/page1-liui-completion-gate.yml"

permissions:
  contents: read

jobs:
  canonical-home-liui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      LANERIQ_EVIDENCE_LEVEL: CODE_CI_ONLY
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Home LIUI completion contract
        run: node scripts/batch65-page1-liui-completion-tests.mjs

      - name: Validate Canonical UI regression contract
        run: node scripts/ui-regression-gate.mjs

      - name: Build runtime integration
        run: npm run build

      - name: Evidence boundary
        run: |
          echo "✓ CODE + CI + build integration for the Canonical Home/UI surface."
          echo "✓ Fixed 18-page structure is no longer UI authority."
          echo "✓ Production exact SHA and browser/mobile runtime evidence remain separately mandatory."
