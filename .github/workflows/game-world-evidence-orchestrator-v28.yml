name: Game World Evidence Orchestrator V28 Gate
on:
  push:
    branches: [batch189-game-world-evidence-orchestrator-v28]
  pull_request:
    paths:
      - 'lib/game/game-world-device-simulation-v26.js'
      - 'lib/game/game-world-engine-export-preflight-v27.js'
      - 'lib/game/game-world-evidence-orchestrator-v28.js'
      - 'scripts/game-world-*-v2[6-8]-tests.mjs'
      - 'scripts/game-world-v28-evidence-report.mjs'
      - 'app/game-world-v28/**'
      - 'app/game-builder/layout.js'
      - '.github/workflows/game-world-evidence-orchestrator-v28.yml'
jobs:
  evidence-orchestrator-v28:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: V25 production evidence regression
        run: node scripts/game-world-production-evidence-v25-tests.mjs
      - name: V26 device simulation truth gate
        run: node scripts/game-world-device-simulation-v26-tests.mjs
      - name: V27 engine export static preflight
        run: node scripts/game-world-engine-export-preflight-v27-tests.mjs
      - name: V28 evidence orchestrator
        run: node scripts/game-world-evidence-orchestrator-v28-tests.mjs
      - name: Generate evidence report
        run: node scripts/game-world-v28-evidence-report.mjs
      - name: Existing game runtime regression
        run: npm run test:game-runtime
      - name: Advanced 3D regression
        run: npm run test:advanced-3d
      - name: Content production regression
        run: npm run test:content-pipeline
      - name: Next production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: game-world-v28-simulated-evidence
          path: test-results/game-world-v28-evidence.json
          retention-days: 14
