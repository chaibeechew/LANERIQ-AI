name: LANERIQ No-Credits Launch Mode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "config/launch-mode.js"
      - "app/components/LaunchModeGuard.js"
      - "app/credits/**"
      - "app/api/credits/**"
      - "app/layout.js"
      - "app/page.js"
      - "app/home-liui-v5.css"
      - "lib/app-builder-finance.js"
      - "app/api/generate/**"
      - "app/api/modify/**"
      - "scripts/no-credits-launch-mode-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/no-credits-launch-mode.yml"

jobs:
  no-credits-launch-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run No-Credits launch contracts
        run: node scripts/no-credits-launch-mode-contract-tests.mjs
      - name: Report
        run: echo "LANERIQ No-Credits Launch Mode passed. Customer-facing Credits navigation, balance route, shortage prompts and free-first-project messaging are disabled for the current launch phase while dormant backend entitlement/ledger compatibility remains intact. This does not advance Email/SMS, add paid infrastructure or delete historical migrations."
