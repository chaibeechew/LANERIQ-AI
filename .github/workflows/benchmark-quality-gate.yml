name: LANERIQ Benchmark Factory & Quality Judge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/ai/benchmark-factory.js"
      - "lib/ai/**quality*"
      - "lib/ai/**self-heal*"
      - "scripts/benchmark-factory-contract-tests.mjs"
      - "scripts/generation-outcome-intelligence-contract-tests.mjs"
      - "scripts/self-heal-contract-tests.mjs"
      - "app/api/generate/**"
      - "app/api/modify/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/benchmark-quality-gate.yml"

jobs:
  benchmark-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generation Outcome Intelligence contracts
        run: npm run test:generation-outcome
      - name: Benchmark Factory & Automatic Quality Judge contracts
        run: npm run test:benchmark-factory
      - name: Autonomous Self-Heal integration contracts
        run: npm run test:self-heal
      - name: Evidence boundary
        run: echo "This gate is deterministic CODE/CI evidence. It does not claim live provider, browser, physical-device, store, legal originality or Production success."
