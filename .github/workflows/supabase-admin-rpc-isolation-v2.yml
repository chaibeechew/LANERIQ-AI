name: LANERIQ Supabase Admin RPC Isolation v2 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260906072500_admin_rpc_isolation_v2_phase_a.sql"
      - "supabase/migrations/20260906074000_public_function_default_privileges_fail_closed.sql"
      - "supabase/migrations/20260904003000_creator_support_and_portability.sql"
      - "supabase/migrations/20260904003300_block_draft_migration_agreement_signing.sql"
      - "lib/buyout-license/server.js"
      - "lib/cloud-adapters/creator-support-data.js"
      - "scripts/supabase-admin-rpc-isolation-v2-contract-tests.mjs"
      - "config/supabase-security-definer-policy.json"
      - "config/production-release-closure-policy.json"
      - ".github/workflows/supabase-admin-rpc-isolation-v2.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260906072500_admin_rpc_isolation_v2_phase_a.sql"
      - "supabase/migrations/20260906074000_public_function_default_privileges_fail_closed.sql"
      - "supabase/migrations/20260904003000_creator_support_and_portability.sql"
      - "supabase/migrations/20260904003300_block_draft_migration_agreement_signing.sql"
      - "lib/buyout-license/server.js"
      - "lib/cloud-adapters/creator-support-data.js"
      - "scripts/supabase-admin-rpc-isolation-v2-contract-tests.mjs"
      - "config/supabase-security-definer-policy.json"
      - "config/production-release-closure-policy.json"
      - ".github/workflows/supabase-admin-rpc-isolation-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Supabase privilege governance + Admin RPC v2 contract
        run: node scripts/supabase-admin-rpc-isolation-v2-contract-tests.mjs
      - name: Truth boundary
        run: |
          echo "✓ Phase A2 switches privileged Admin mutations to service-role v2 only after user-session Admin proof."
          echo "✓ Each v2 RPC independently revalidates the supplied Admin actor in auth.users metadata."
          echo "✓ There is no silent fallback to legacy authenticated Admin RPC v1 in server callers."
          echo "✓ This gate does not mutate Production Supabase or prove that A1 v2 ACLs are LIVE; A1 LIVE verification is a release prerequisite."
          echo "✓ Legacy v1 authenticated EXECUTE remains until Phase A2 is Production-verified and Phase B is separately released."
          echo "✓ Future postgres-created public functions require explicit grants."
          echo "✓ supabase_admin function-default hardening remains an elevated-role follow-up and is not falsely claimed by this gate."
          echo "✓ Reviewed auth.uid()-bound self-service RPCs remain intentional authenticated exceptions."
          echo "✓ Draft migration-agreement signing remains fail-closed pending legal approval."
          echo "✓ Supabase leaked-password protection remains an unresolved Global Production blocker until LIVE-enabled and re-verified."
