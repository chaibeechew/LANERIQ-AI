name: LANERIQ Anti Scam Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/laneriq-security-android/**'
      - '.github/workflows/laneriq-security-android-apk.yml'
  pull_request:
    paths:
      - 'apps/laneriq-security-android/**'
      - '.github/workflows/laneriq-security-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p apps/laneriq-security-android assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f apps/laneriq-security-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: laneriq-anti-scam-android-debug-apk
          path: apps/laneriq-security-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
