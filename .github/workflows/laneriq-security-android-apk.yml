name: LANERIQ Security Android APK

on:
  push:
    branches:
      - main
      - project/laneriq-anti-scam
    paths:
      - 'apps/laneriq-security-android/**'
      - 'projects/laneriq-anti-scam/android/**'
      - '.github/workflows/laneriq-security-android-apk.yml'
  pull_request:
    paths:
      - 'apps/laneriq-security-android/**'
      - 'projects/laneriq-anti-scam/android/**'
      - '.github/workflows/laneriq-security-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-legacy-apk:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build legacy debug APK
        run: gradle -p apps/laneriq-security-android assembleDebug --stacktrace
      - name: Verify legacy APK exists
        run: test -f apps/laneriq-security-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: laneriq-security-android-debug-apk
          path: apps/laneriq-security-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  anti-scam-p0:
    if: github.ref_name == 'project/laneriq-anti-scam' || github.head_ref == 'project/laneriq-anti-scam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Anti Scam P0 truth-state tests
        run: gradle -p projects/laneriq-anti-scam/android testDebugUnitTest --stacktrace
      - name: Build Anti Scam P0 debug APK
        run: gradle -p projects/laneriq-anti-scam/android assembleDebug --stacktrace
      - name: Verify Anti Scam P0 APK exists
        run: test -f projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: laneriq-anti-scam-p0-android-debug-apk
          path: projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
