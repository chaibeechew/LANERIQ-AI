name: Auth Mobile Entry Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "app/auth/**"
      - "app/api/auth/**"
      - "lib/auth/**"
      - "scripts/auth-mobile-entry-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auth-mobile-entry.yml"
  push:
    branches: [main]

jobs:
  auth-mobile-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:auth-mobile-entry
