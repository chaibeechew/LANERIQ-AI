name: LANERIQ 18-Page Product Surface Gate

# Compatibility workflow identity retained for release-control history.
# Fixed-page customer presentation is retired; this gate validates the canonical UI registry and build.
on:
  push:
    branches: [main, 'ui/canonical-*']
  pull_request:
    branches: [main]

jobs:
  product-surface-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SOOLEN_COST_MODE: zero
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical customer UI contract
        run: node scripts/canonical-ui-source-of-truth-tests.mjs
      - name: Build runtime integration
        run: npm run build
      - name: Evidence boundary
        run: echo "This compatibility gate proves CODE/CI canonical product-surface structure and build only. Production exact SHA and runtime evidence remain independent."
