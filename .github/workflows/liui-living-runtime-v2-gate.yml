name: LANERIQ LIUI Living Runtime v2 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/design/**"
      - "lib/ai/liui-standard.js"
      - "scripts/batch99-liui-living-runtime-v2-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/liui-living-runtime-v2-gate.yml"
  push:
    branches: [main]

jobs:
  living-runtime-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate localized continuity and intelligence composition
        run: node scripts/batch99-liui-living-runtime-v2-tests.mjs
      - name: Build Next.js runtime integration
        run: npm run build
      - name: Evidence boundary
        run: echo "Living Runtime v2 validates UI code/CI only. Production exact SHA, protected-browser runtime, providers, malware, devices and stores remain separate evidence."
