name: LANERIQ Capacity 1K-5K-10K Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/infrastructure/capacity-evidence.js"
      - "scripts/capacity-load-evidence-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/capacity-load-evidence.yml"

jobs:
  capacity-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SOOLEN_COST_MODE: zero
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run synthetic 1k 5k 10k capacity evidence
        run: node scripts/capacity-load-evidence-contract-tests.mjs
      - name: Build without changing execution paths
        run: npm run build
      - name: Evidence boundary
        run: echo "This gate proves SYNTHETIC_CI capacity-protection behavior only. It sends no Production traffic, makes no provider calls, spends no provider credits, exercises neither SMS nor Email, and does not claim Preview, Production, Provider LIVE, physical-device or store capacity evidence."
