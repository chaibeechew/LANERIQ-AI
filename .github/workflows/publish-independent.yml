name: Independent Publish Service Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/publish/**"
      - "app/api/apps/**/publish/**"
      - "app/release/**"
      - "lib/publishing/**"
      - "scripts/web-publish*.mjs"
      - "supabase/migrations/*web_publish*.sql"
      - "supabase/migrations/*published_project_version*.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-independent.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify independent Publish boundary
        run: node services/publish/test/contract.mjs
      - name: Verify existing Web Publish contracts
        run: npm run test:web-publish
      - name: Build Next.js host
        run: npm run build
