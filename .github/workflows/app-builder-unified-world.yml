# P3 rebuilt on Batch 173 Production main; exact-head CI is required before merge.
name: LANERIQ App Builder Unified World Gate

on:
  pull_request:
    paths:
      - 'app/api/generate/route.js'
      - 'app/api/modify/route.js'
      - 'lib/generator/quality-gate-rescue.js'
      - 'lib/generator/quality-recovery-intelligence.js'
      - 'lib/generator/failure-pattern-intelligence.js'
      - 'lib/project-memory.js'
      - 'lib/cloud/builder-projects.js'
      - 'lib/cloud-adapters/builder-project-world-data.js'
      - 'lib/intelligence/**'
      - 'lib/reality/**'
      - 'supabase/migrations/20260905064500_app_builder_unified_world_atomic_persistence.sql'
      - 'scripts/app-builder-unified-world-contract-tests.mjs'
      - 'scripts/unified-intelligence-core-contract-tests.mjs'
      - 'scripts/ai-modify-contract-tests.mjs'
      - 'scripts/generate-quality-gate-error-boundary-tests.mjs'
      - 'scripts/failure-pattern-intelligence-contract-tests.mjs'
      - 'scripts/self-heal-contract-tests.mjs'
      - '.github/workflows/app-builder-unified-world.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-builder-unified-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: App Builder Unified World contract
        run: node scripts/app-builder-unified-world-contract-tests.mjs
      - name: Unified Intelligence regression
        run: node scripts/unified-intelligence-core-contract-tests.mjs
      - name: App Builder Modify regression
        run: node scripts/ai-modify-contract-tests.mjs
      - name: Generate quality-boundary regression
        run: node scripts/generate-quality-gate-error-boundary-tests.mjs
      - name: Failure-pattern recovery ranking regression
        run: node scripts/failure-pattern-intelligence-contract-tests.mjs
      - name: App Builder self-heal regression
        run: node scripts/self-heal-contract-tests.mjs
      - name: Syntax checks
        run: |
          node --check lib/intelligence/app-builder-world-bridge.js
          node --check lib/intelligence/unified-intelligence-contract.js
          node --check lib/generator/quality-gate-rescue.js
          node --check lib/generator/quality-recovery-intelligence.js
          node --check lib/generator/failure-pattern-intelligence.js
          node --check lib/project-memory.js
          node --check lib/cloud-adapters/builder-project-world-data.js
          node --check lib/cloud/builder-projects.js
          node --check app/api/generate/route.js
          node --check app/api/modify/route.js
      - name: Truth boundary
        run: |
          node --input-type=module - <<'NODE'
          import { summarizeUnifiedIntelligenceCore } from './lib/intelligence/unified-intelligence-contract.js';
          const status=summarizeUnifiedIntelligenceCore();
          if(status.liveClaims.length!==0) throw new Error('App Builder integration must not create unverified LIVE claims');
          if(status.policy.appBuilderWorldMemoryAtomic!==true) throw new Error('App Builder atomic World policy missing');
          if(!status.capabilities.includes('app-builder-world-orchestration')) throw new Error('App Builder world capability missing');
          console.log('App Builder Unified World truth boundary: PASS');
          NODE
