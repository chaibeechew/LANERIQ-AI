name: Independent Memory Service Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/memory/**"
      - "lib/project-memory.js"
      - "lib/cloud-adapters/builder-project-data.js"
      - "lib/cloud-adapters/builder-project-world-data.js"
      - "app/api/apps/**/memory/**"
      - "app/api/apps/**/bootstrap/**"
      - "app/api/generate/**"
      - "app/api/modify/**"
      - "scripts/project-memory-contract-tests.mjs"
      - "supabase/migrations/*project_memory*.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/memory-independent.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify standalone memory service
        run: node services/memory/test/contract.mjs
      - name: Verify existing Project Memory contracts
        run: npm run test:memory
      - name: Build Next.js host
        run: npm run build
