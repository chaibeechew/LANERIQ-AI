name: LANERIQ LIUI Real Product Surface Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/product/laneriq-18-page-master.js"
      - "lib/ai/liui-standard.js"
      - "scripts/batch40-liui-real-product-surface-tests.mjs"
      - "docs/LANERIQ_AI_18_PAGE_MASTER_PRODUCT_SPEC.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/liui-real-product-surface-gate.yml"

jobs:
  liui-real-product-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SOOLEN_COST_MODE: zero
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate LIUI real product surface
        run: node scripts/batch40-liui-real-product-surface-tests.mjs
      - name: Build without replacing real engines
        run: npm run build
      - name: Evidence boundary
        run: echo "This gate proves CODE/CI LIUI integration on the real LANERIQ surfaces. Production exact SHA, browser, provider LIVE, physical-device and store evidence remain independent."
