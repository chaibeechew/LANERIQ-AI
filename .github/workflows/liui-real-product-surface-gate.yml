name: LANERIQ LIUI Real Product Surface Gate

on:
  push:
    branches: [main, 'ui/canonical-*']
    paths:
      - 'app/components/LIUIRealProductSurface.js'
      - 'app/liui-real-product-surface.css'
      - 'app/liui-canonical-product-surface.css'
      - 'lib/product/canonical-ui-registry.js'
      - 'scripts/batch40-liui-real-product-surface-tests.mjs'
      - '.github/workflows/liui-real-product-surface-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/components/LIUIRealProductSurface.js'
      - 'app/liui-real-product-surface.css'
      - 'app/liui-canonical-product-surface.css'
      - 'lib/product/canonical-ui-registry.js'
      - 'scripts/batch40-liui-real-product-surface-tests.mjs'
      - '.github/workflows/liui-real-product-surface-gate.yml'

jobs:
  liui-real-product-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SOOLEN_COST_MODE: zero
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate canonical real product surface
        run: node scripts/batch40-liui-real-product-surface-tests.mjs
      - name: Build without replacing real engines
        run: npm run build
      - name: Evidence boundary
        run: echo "This gate proves CODE/CI canonical LIUI integration on real LANERIQ surfaces. Production exact SHA, browser, provider LIVE, physical-device and store evidence remain independent."
