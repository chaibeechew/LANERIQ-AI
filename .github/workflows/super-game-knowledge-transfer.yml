name: Super Game Knowledge Transfer Gate
on:
  pull_request:
  push:
    branches: [main, "feature/ai-map-super-game-world-fusion"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify World + Avatar + Forge + Fusion knowledge
        run: node scripts/super-game-knowledge-transfer-tests.mjs
