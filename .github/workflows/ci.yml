name: LANERIQ AI 100 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          dir="supabase/migrations"
          test -d "$dir"
          files=("$dir"/*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
            if [[ ! -s "$file" ]]; then
              echo "Empty migration: $base"
              exit 1
            fi
          done
          duplicates=$(printf '%s\n' "${files[@]}" | sed 's#^.*/##' | cut -d_ -f1 | sort | uniq -d || true)
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration timestamps:"
            echo "$duplicates"
            exit 1
          fi
          echo "Migration filename validation passed."
