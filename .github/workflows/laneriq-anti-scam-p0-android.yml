name: LANERIQ Anti Scam P0-P6 Security Fabric Gate

on:
  push:
    branches:
      - project/laneriq-anti-scam
    paths:
      - 'projects/laneriq-anti-scam/android/**'
      - 'projects/laneriq-anti-scam/fabric/**'
      - '.github/workflows/laneriq-anti-scam-p0-android.yml'
  pull_request:
    paths:
      - 'projects/laneriq-anti-scam/android/**'
      - 'projects/laneriq-anti-scam/fabric/**'
      - '.github/workflows/laneriq-anti-scam-p0-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Guardian unit tests
        run: gradle -p projects/laneriq-anti-scam/android testDebugUnitTest --stacktrace
      - name: Run Android lint truth gate
        run: gradle -p projects/laneriq-anti-scam/android lintDebug --stacktrace
      - name: Build P0 debug APK
        run: gradle -p projects/laneriq-anti-scam/android assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record APK SHA-256
        run: sha256sum projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk | tee projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: laneriq-anti-scam-p0-android-debug-apk
          path: |
            projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk
            projects/laneriq-anti-scam/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  security-fabric-p0-p6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run P0-P6 Security Fabric contract tests
        run: node --test projects/laneriq-anti-scam/fabric/test/*.test.mjs
      - name: Enforce no billion-scale claim without evidence
        run: |
          node -e "import('./projects/laneriq-anti-scam/fabric/p6-capacity-evidence.mjs').then(({CapacityEvidenceLedger})=>{const x=new CapacityEvidenceLedger(); if(x.summary().billionScaleVerified) process.exit(1); console.log(x.summary())})"
