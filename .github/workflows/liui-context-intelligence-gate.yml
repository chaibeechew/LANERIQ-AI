name: LANERIQ LIUI Context Intelligence Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/components/LIUIContextIntelligence.js"
      - "app/liui-context-intelligence.css"
      - "app/layout.js"
      - "lib/i18n/liui-context-translations.js"
      - "lib/product/canonical-ui-registry.js"
      - "scripts/batch95-liui-context-intelligence-tests.mjs"
      - ".github/workflows/liui-context-intelligence-gate.yml"
  push:
    branches: [main, 'ui/canonical-*']
    paths:
      - "app/components/LIUIContextIntelligence.js"
      - "app/liui-context-intelligence.css"
      - "app/layout.js"
      - "lib/i18n/liui-context-translations.js"
      - "lib/product/canonical-ui-registry.js"
      - "scripts/batch95-liui-context-intelligence-tests.mjs"
      - ".github/workflows/liui-context-intelligence-gate.yml"

jobs:
  context-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical LIUI Context Intelligence contract
        run: node scripts/batch95-liui-context-intelligence-tests.mjs
      - name: Evidence boundary
        run: echo "UI contract only — this gate does not substitute for Production exact-SHA, browser/runtime, provider, physical-device, Malware scanner, transport or store evidence."
