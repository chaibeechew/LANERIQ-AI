name: LANERIQ LIUI Simplification Performance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/design/**"
      - "lib/ai/liui-standard.js"
      - "scripts/batch156-liui-simplification-performance-tests.mjs"
      - "scripts/batch153-liui-five-layer-100-tests.mjs"
      - "scripts/mobile-ui-contract-tests.mjs"
      - "scripts/mobile-performance-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/liui-simplification-performance.yml"
  push:
    branches: [main]

jobs:
  liui-simplification-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate subtraction and performance contracts
        run: node scripts/batch156-liui-simplification-performance-tests.mjs
      - name: Preserve five-layer runtime
        run: node scripts/batch153-liui-five-layer-100-tests.mjs
      - name: Preserve LIUI runtime and mobile contracts
        run: npm run test:liui-runtime && npm run test:liui-living && npm run test:mobile-ui && npm run test:mobile-performance
      - name: Build complete Next.js integration
        run: npm run build
      - name: Evidence boundary
        run: echo "Batch 156 proves code/CI simplification and browser-rendering optimizations. Physical-device UX/performance remains a separate evidence gate."
