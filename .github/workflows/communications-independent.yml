name: Independent Communications Service Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/communications/**"
      - "services/communications/**"
      - "app/api/communications/**"
      - "scripts/*communications*.mjs"
      - "scripts/zero-cost-omnichannel-contract-tests.mjs"
      - "supabase/migrations/*communication*.sql"
      - "docs/independent-communications-service.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/communications-independent.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify independent communications core
        run: node scripts/independent-communications-service-contract-tests.mjs
      - name: Verify remote/embedded cutover gateway
        run: node scripts/communications-service-gateway-contract-tests.mjs
      - name: Verify standalone service host
        run: npm test --prefix services/communications
      - name: Verify standalone deployment preflight
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-service-secret-key-placeholder-123456
          LANERIQ_COMMUNICATIONS_SERVICE_SECRET: ci-communications-secret-placeholder-1234567890
          LANERIQ_COMMUNICATIONS_SERVICE_CLIENT_ID: laneriq-ai
        run: npm run preflight --prefix services/communications
      - name: Verify standalone LIVE canary gate semantics
        run: node scripts/communications-standalone-canary-contract-tests.mjs
      - name: Verify zero-cost omnichannel policy remains authoritative
        run: npm run test:zero-cost-communications
      - name: Verify full communications safety contract
        run: npm run test:communications-100
      - name: Build Next.js service host
        run: npm run build
