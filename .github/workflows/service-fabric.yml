name: LANERIQ Sovereign Service Fabric Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/fabric/**"
      - "services/generation/**"
      - "services/memory/**"
      - "services/cloud/**"
      - "services/publish/**"
      - "app/api/system/sovereign/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service-fabric.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify service registry and deployment policy
        run: node services/fabric/test/registry.mjs
      - name: Verify Generation extraction
        run: node services/generation/test/contract.mjs
      - name: Verify Memory extraction
        run: node services/memory/test/contract.mjs
      - name: Verify Cloud extraction
        run: node services/cloud/test/contract.mjs
      - name: Verify Publish extraction
        run: node services/publish/test/contract.mjs
      - name: Build host integration
        run: npm run build
