name: Sovereign Modular Intelligence Fabric Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/sovereign/**"
      - "app/api/system/sovereign/**"
      - "scripts/sovereign-modular-intelligence-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sovereign-modular-intelligence.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify sovereign modular intelligence contracts
        run: node scripts/sovereign-modular-intelligence-contract-tests.mjs
      - name: Build Next.js host
        run: npm run build
